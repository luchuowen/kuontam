name: factory-check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/factory-check.sh full
